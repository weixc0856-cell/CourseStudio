name: CourseStudio CI

# Pin the runner and Node 24 actions to avoid ubuntu-latest migrations
# and the Node 20 deprecation warning.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Syntax Check Python Scripts
      run: |
        python -m py_compile tools/check-episode.py tools/check-links.py
    - name: Run Link Checker
      run: |
        python tools/check-links.py .
    - name: Run Negative Tests
      run: |
        python tools/test_check_episode_negative.py

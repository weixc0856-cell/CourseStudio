<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion Canvas — Recording</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #FAFAF7;
        cursor: none;
      }
      #stage {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #FAFAF7;
      }
      motion-canvas-player {
        display: block;
        width: min(100vw, 177.7778vh);
        height: min(100vh, 56.25vw);
      }
      #mc-status {
        position: fixed;
        left: -99999px;
        top: -99999px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <!--
        The script sets:
          src="/src/projects/<segment>.ts?project"
        from the ?segment=<name> query parameter.
        auto MUST be "true": the bare boolean attribute reads as an empty string
        and the player treats it as false.
      -->
      <motion-canvas-player id="player" auto="true"></motion-canvas-player>
    </div>
    <div id="mc-status">pending</div>

    <script type="module">
      import '@motion-canvas/player';

      const params = new URLSearchParams(location.search);
      const segment = params.get('segment') ?? '';
      const qualityParam = params.get('quality');
      const keepLoop = params.get('loop') === '1';
      const probe = params.get('probe') === '1';
      const status = document.getElementById('mc-status');
      const el = document.getElementById('player');

      const writeStatus = (value) => {
        status.textContent = JSON.stringify(value);
      };

      if (!/^[A-Za-z0-9_-]+$/.test(segment)) {
        writeStatus({error: 'missing or invalid ?segment=<name>'});
        throw new Error('missing or invalid ?segment=<name>');
      }

      document.title = `MC — ${segment}`;
      el.setAttribute('src', `/src/projects/${segment}.ts?project`);

      const hideOverlay = () => {
        const root = el.shadowRoot;
        if (!root || root.querySelector('style[data-recording]')) return;
        const style = document.createElement('style');
        style.dataset.recording = '1';
        style.textContent = '.overlay, .button { display: none !important; }';
        root.appendChild(style);
      };

      let applied = false;
      let probed = false;
      const timer = setInterval(() => {
        hideOverlay();
        try {
          if (!el.player) {
            writeStatus({segment, ready: false, state: el.state ?? null});
            return;
          }

          if (!applied && el.state === 'ready') {
            if (qualityParam) {
              const quality = Number.parseFloat(qualityParam);
              if (Number.isFinite(quality) && quality >= 0.5 && quality <= 4) {
                el.setAttribute('quality', String(quality));
              }
            }
            if (!keepLoop && typeof el.player.toggleLoop === 'function') {
              el.player.toggleLoop(false);
            }
            applied = true;
          }

          if (probe && !probed && el.state === 'ready') {
            probed = true;
            Promise.resolve(el.player.run()).catch((error) => {
              writeStatus({segment, error: String(error)});
            });
          }

          const playback = el.player.playback;
          const fps = playback.fps || 60;
          writeStatus({
            segment,
            ready: el.state === 'ready',
            paused: el.player.playerState.current.paused,
            frame: playback.frame,
            durationFrames: playback.duration,
            fps,
            seconds: Number((playback.duration / fps).toFixed(3)),
            state: playback.state,
            loop: el.player.playerState.current.loop,
            quality: el.quality,
            probe,
          });
        } catch (error) {
          writeStatus({segment, error: String(error)});
        }
      }, 200);

      // Keep a handle for automated duration probes.
      window.__MC_RECORDING__ = {el, timer, segment};
    </script>
  </body>
</html>
